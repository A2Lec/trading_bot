name: Backtest

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Période (2y, 5y, 10y, max)"
        default: "5y"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -m bot backtest --period "${{ inputs.period }}" --csv | tee result.txt
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.period }}
          path: backtest_*.csv
