name: Daily run

on:
  schedule:
    # Tous les jours à 22:17 UTC : après la clôture US (été comme hiver).
    # Le week-end, seules les cryptos bougent ; les ordres actions attendent lundi.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      no_llm:
        description: "Ne pas appeler Gemini"
        type: boolean
        default: false

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL manquant"; exit 1; fi
          [ -z "$GEMINI_MODEL" ] && unset GEMINI_MODEL
          python -m bot run ${{ inputs.no_llm && '--no-llm' || '' }}
